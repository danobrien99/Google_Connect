[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-connect"
version = "0.1.0"
description = "Google data connectors for Enterprise_KG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp[cli]>=1.27.0",
  "PyYAML>=6.0",
  "google-api-python-client>=2.169.0",
  "google-auth>=2.40.0",
  "google-auth-oauthlib>=1.2.0",
  "pypdf>=5.4.0",
  "python-docx>=1.1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["google_connect*"]
